name: Stablecoin Engine Reality CI Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  reality-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build TypeScript artifacts
        run: npm run build

      - name: Run Engine Test Suite
        run: npm test

      - name: Static Verification & Lint
        run: npm run lint
